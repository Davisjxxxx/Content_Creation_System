[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "avatar-v2-cli"
version = "0.2.0"
description = "Reference-driven synthetic-human video orchestration CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
avatar-v2 = "avatar_v2.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["avatar_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
